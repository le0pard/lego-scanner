<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#f4c946" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="L-Scan: LEGO Minifigure Scanner" />
    <meta
      property="og:description"
      content="Scan LEGO Minifigure blind boxes to reveal the figure inside"
    />
    <meta property="og:image" content="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />

    <!-- favicons -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
