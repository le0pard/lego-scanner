version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Matches npmMinimalAgeGate in .yarnrc.yml so Yarn doesn't reject proposed versions
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
